<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuizMaster - Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>


<body class="quiz-page">


    <!-- ================= NAVBAR ================= -->

    <header class="dashboard-navbar">

        <div class="logo">

            <span class="logo-icon">
                Q
            </span>

            <span>
                QuizMaster
            </span>

        </div>


        <div>

            <strong id="quizTitle">
                Quiz
            </strong>

        </div>


        <div>

            <span
                id="timer"
                class="timer">

                ⏱️ 5:00

            </span>

            <button
                type="button"
                id="logoutTop"
                class="logout-button">

                Logout

            </button>

        </div>

    </header>



    <!-- ================= QUIZ CONTAINER ================= -->

    <main class="quiz-container">


        <!-- QUIZ HEADER -->

        <section class="quiz-header">

            <h1 id="quizHeading">
                Online Quiz
            </h1>

            <p id="quizDescription">
                Answer all questions carefully.
            </p>

            <p>
                <strong>
                    10 Questions
                </strong>
                &nbsp; | &nbsp;
                <strong>
                    10 Marks Each
                </strong>
                &nbsp; | &nbsp;
                <strong>
                    Total: 100 Marks
                </strong>
            </p>

        </section>



        <!-- ================= PROGRESS ================= -->

        <div
            id="quizProgress"
            style="
                background:white;
                padding:15px 20px;
                border-radius:10px;
                margin-bottom:20px;
                border:1px solid #e5e7eb;
                font-weight:600;
            ">

            Question 1 of 10

        </div>



        <!-- ================= QUESTIONS ================= -->

        <form id="quizForm">

            <div id="questionsContainer">

                <!-- Questions will be generated by JavaScript -->

            </div>


            <!-- ================= SUBMIT ================= -->

            <button
                type="button"
                id="submitQuiz"
                class="submit-button">

                Submit Quiz

            </button>

        </form>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">

            <span class="logo-icon">
                Q
            </span>

            QuizMaster

        </div>

        <p>
            Online Quiz Management System
        </p>

        <p class="copyright">
            © 2026 QuizMaster. All Rights Reserved.
        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
